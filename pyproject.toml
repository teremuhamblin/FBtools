[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fbtools"
version = "1.0.0"
description = "CLI Python pour gérer des Pages Facebook via l'API Graph de Meta"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["click>=8.1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fbtools = "fbtools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fbtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
