[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fbtools"
version = "1.0.0"
description = "CLI Python pour gérer des Pages Facebook via l'API Graph de Meta"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "teremuhamblin" }]
keywords = ["facebook", "meta", "graph-api", "cli", "pages", "social-media", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["click>=8.1", "requests>=2.31"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests>=2.31",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5",
]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/teremuhamblin/FBtools"
Documentation = "https://teremuhamblin.github.io/FBtools/"
Repository = "https://github.com/teremuhamblin/FBtools"
Issues = "https://github.com/teremuhamblin/FBtools/issues"
Changelog = "https://github.com/teremuhamblin/FBtools/blob/main/CHANGELOG.md"

[project.scripts]
fbtools = "fbtools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fbtools"]

[tool.hatch.build.targets.sdist]
include = ["src/fbtools", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["fbtools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

# ---------------------------------------------------------------- lint
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères typographiques français (…, ’)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["fbtools.cli"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
