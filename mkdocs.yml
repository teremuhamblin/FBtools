site_name: FBtools
site_description: CLI Python pour gérer vos Pages Facebook via l'API Graph de Meta
site_url: https://teremuhamblin.github.io/FBtools/
repo_url: https://github.com/teremuhamblin/FBtools
repo_name: teremuhamblin/FBtools
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 teremuhamblin — Licence MIT

theme:
  name: material
  language: fr
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light green
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  icon:
    repo: fontawesome/brands/github
    logo: material/console
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Accueil: index.md
  - Guide:
      - Installation: installation.md
      - Configuration: configuration.md
      - Commandes: commandes.md
      - Automatisation: automatisation.md
  - Référence:
      - Architecture: architecture.md
      - API Python: api-python.md
      - Dépannage: depannage.md
  - Projet:
      - Contribuer: contribuer.md
      - Sécurité: securite.md
      - Journal des modifications: changelog.md
      - Feuille de route: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: info
    unrecognized_links: info
    anchors: info

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/teremuhamblin/FBtools
